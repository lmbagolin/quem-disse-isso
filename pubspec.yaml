name: quem_disse_isso
description: "Quem Disse Isso? — party game de trivia por dedução e memória."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pacotes/
    - assets/som/

  fonts:
    - family: ArchivoBlack
      fonts:
        - asset: assets/fontes/ArchivoBlack-Regular.ttf
    # Fonte variável: um arquivo cobre 300–700 via variações de peso.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fontes/SpaceGrotesk.ttf
